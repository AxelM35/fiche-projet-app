services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fiche_projet}
      POSTGRES_USER: ${DB_USER:-fiche_projet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit être définie dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Publié uniquement sur la boucle locale du serveur : l'application
      # joint la base par le réseau interne Docker (hôte "db"), ce port n'est
      # exposé que pour un accès administrateur depuis le serveur lui-même.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fiche_projet_user} -d ${DB_NAME:-fiche_projet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fiche_projet}
      DB_USER: ${DB_USER:-fiche_projet_user}
      DB_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit être définie dans .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ETABLISSEMENT_NOM: ${ETABLISSEMENT_NOM:-}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:?la variable ALLOWED_EMAIL_DOMAIN doit être définie dans .env}
      ROLES_ADMIN: ${ROLES_ADMIN:-}
      ROLES_COMPTA: ${ROLES_COMPTA:-}
      ROLES_VIESCO: ${ROLES_VIESCO:-}
      ROLES_DIRECTION: ${ROLES_DIRECTION:-}
      ROLES_LECTURE_SEULE: ${ROLES_LECTURE_SEULE:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      RELANCES_SEUIL_JOURS: ${RELANCES_SEUIL_JOURS:-7}
      RELANCES_PERIODE_JOURS: ${RELANCES_PERIODE_JOURS:-7}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_SHARED_DRIVE_ID: ${GOOGLE_DRIVE_SHARED_DRIVE_ID:-}
      GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64: ${GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64:-}
    ports:
      - "8080:8080"
    volumes:
      # Lecture seule : uniquement pour que la page admin "Santé" affiche la
      # date de la dernière sauvegarde. L'application n'écrit jamais ici.
      - ./backups:/backups:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-fiche_projet}
      POSTGRES_USER: ${DB_USER:-fiche_projet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit être définie dans .env}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db_data:
