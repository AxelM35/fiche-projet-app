services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-voyages_scolaires}
      POSTGRES_USER: ${DB_USER:-voyages_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit etre definie dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-voyages_user} -d ${DB_NAME:-voyages_scolaires}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-voyages_scolaires}
      DB_USER: ${DB_USER:-voyages_user}
      DB_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit etre definie dans .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-college-sthelier.fr}
      ROLES_ADMIN: ${ROLES_ADMIN:-amorvan@college-sthelier.fr}
      ROLES_COMPTA: ${ROLES_COMPTA:-compta@college-sthelier.fr}
      ROLES_VIESCO: ${ROLES_VIESCO:-viesco@college-sthelier.fr}
      ROLES_DIRECTION: ${ROLES_DIRECTION:-direction@college-sthelier.fr}
      ROLES_LECTURE_SEULE: ${ROLES_LECTURE_SEULE:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@college-sthelier.fr}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      RELANCES_SEUIL_JOURS: ${RELANCES_SEUIL_JOURS:-7}
      RELANCES_PERIODE_JOURS: ${RELANCES_PERIODE_JOURS:-7}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_SHARED_DRIVE_ID: ${GOOGLE_DRIVE_SHARED_DRIVE_ID:-}
      GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64: ${GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64:-}
    ports:
      - "8080:8080"
    volumes:
      # Lecture seule : uniquement pour que la page admin "Sante" affiche la
      # date de la derniere sauvegarde. L'application n'ecrit jamais ici.
      - ./backups:/backups:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-voyages_scolaires}
      POSTGRES_USER: ${DB_USER:-voyages_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit etre definie dans .env}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db_data:
