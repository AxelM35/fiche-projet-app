# Configuration utilisee uniquement par les tests d'integration : base H2 en
# memoire (pas de dependance a un vrai PostgreSQL) et identifiants OAuth2
# fictifs (aucune connexion Google reelle n'est effectuee pendant les tests).
spring.datasource.url=jdbc:h2:mem:voyages_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# La migration V1 est ecrite en SQL PostgreSQL : en test on garde le schema
# genere directement par Hibernate sur la base H2 en memoire.
spring.flyway.enabled=false

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

voyages.security.allowed-email-domain=college-sthelier.fr
voyages.roles.admin=amorvan@college-sthelier.fr
voyages.roles.compta=compta@college-sthelier.fr
voyages.roles.viesco=viesco@college-sthelier.fr
voyages.roles.direction=direction@college-sthelier.fr
