# Configuration utilisée uniquement par les tests d'intégration : base H2 en
# mémoire (pas de dépendance à un vrai PostgreSQL) et identifiants OAuth2
# fictifs (aucune connexion Google réelle n'est effectuée pendant les tests).
spring.datasource.url=jdbc:h2:mem:fiche_projet_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# La migration V1 est écrite en SQL PostgreSQL : en test on garde le schéma
# généré directement par Hibernate sur la base H2 en mémoire.
spring.flyway.enabled=false

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

ficheprojet.etablissement.nom=Collège Exemple
ficheprojet.security.allowed-email-domain=exemple.fr
ficheprojet.roles.admin=admin@exemple.fr
ficheprojet.roles.compta=compta@exemple.fr
ficheprojet.roles.viesco=viesco@exemple.fr
ficheprojet.roles.direction=direction@exemple.fr
