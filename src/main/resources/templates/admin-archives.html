<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dossiers archives - Voyages Scolaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container px-4" style="padding-bottom: 3rem;">

    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${messageSucces}" th:text="${messageSucces}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h1 class="h4 mb-4"><i class="bi bi-archive me-2"></i>Dossiers archives</h1>

    <p class="text-muted" th:if="${#lists.isEmpty(projetsArchives)}">Aucun dossier archive.</p>

    <div class="card carte-formulaire shadow-sm" th:unless="${#lists.isEmpty(projetsArchives)}">
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Nom du projet</th>
                    <th>Statut</th>
                    <th>Dates</th>
                    <th>Organisateur</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="projet : ${projetsArchives}">
                    <td th:text="${projet.nomProjet}">Nom</td>
                    <td>
                        <span class="badge-statut" th:switch="${projet.statut.name()}">
                            <span th:case="'BROUILLON'" class="badge-statut-brouillon">Brouillon</span>
                            <span th:case="'EN_ATTENTE_COMPTA'" class="badge-statut-attente">En attente</span>
                            <span th:case="'EN_ATTENTE_VIE_SCOLAIRE'" class="badge-statut-attente">En attente</span>
                            <span th:case="'EN_ATTENTE_DIRECTION'" class="badge-statut-attente">En attente</span>
                            <span th:case="'VALIDE'" class="badge-statut-valide">Valide</span>
                            <span th:case="'A_CORRIGER'" class="badge-statut-corriger">A corriger</span>
                        </span>
                    </td>
                    <td>
                        <span th:if="${projet.dateDepart} != null" th:text="${#temporals.format(projet.dateDepart, 'dd/MM/yyyy')}">-</span>
                    </td>
                    <td th:text="${projet.organisateurNom}">-</td>
                    <td class="text-end">
                        <form th:action="@{/projets/{id}/desarchiver(id=${projet.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-arrow-counterclockwise me-1"></i>Desarchiver</button>
                        </form>
                        <form th:action="@{/projets/{id}/supprimer(id=${projet.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer definitivement ce dossier ? Cette action est irreversible.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Supprimer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
