<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">Voyages Scolaires - College Saint-Helier</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white-50 small" th:text="${utilisateurConnecte}">utilisateur@college-sthelier.fr</span>
            <span class="badge bg-primary" sec:authorize="hasRole('COMPTA')">Comptabilite</span>
            <span class="badge bg-info text-dark" sec:authorize="hasRole('VIESCO')">Vie Scolaire</span>
            <span class="badge bg-warning text-dark" sec:authorize="hasRole('DIRECTION')">Direction</span>
            <span class="badge bg-danger" sec:authorize="hasRole('ADMIN')">Admin</span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/projets/nouveau}">+ Nouveau projet</a>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Deconnexion</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
