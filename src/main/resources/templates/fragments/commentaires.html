<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
    Fil de commentaires d'un dossier (echanges libres entre organisateur et
    valideurs, independants du motif de refus) : parametres
    - projetId : identifiant du dossier
    - commentaires : List<Commentaire>, deja triee du plus ancien au plus recent
    - commentaireForm : CommentaireFormDTO (formulaire d'ajout)
    - peutCommenter : boolean, meme perimetre que la gestion du lien Drive
    - emailUtilisateurConnecte : pour n'afficher Modifier/Supprimer qu'a l'auteur
-->
<div th:fragment="commentaires(projetId, commentaires, commentaireForm, peutCommenter, emailUtilisateurConnecte)"
     class="card carte-formulaire shadow-sm">
    <div class="card-header fw-semibold"><i class="bi bi-chat-square-text me-2"></i>Fil de commentaires</div>
    <div class="card-body">

        <p class="text-muted small" th:if="${#lists.isEmpty(commentaires)}">Aucun commentaire pour l'instant.</p>

        <div th:each="commentaire : ${commentaires}" class="mb-3 pb-3 border-bottom">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="fw-semibold" th:text="${commentaire.auteurEmail}">auteur@college-sthelier.fr</span>
                    <span class="text-muted small" th:if="${commentaire.auteurRole}" th:text="'(' + ${commentaire.auteurRole} + ')'">(Rôle)</span>
                </div>
                <div class="text-muted small text-end">
                    <span th:text="${#temporals.format(commentaire.dateCreation, 'dd/MM/yyyy HH:mm')}">-</span>
                    <span th:if="${commentaire.dateModification != null}"> (modifié)</span>
                </div>
            </div>
            <p class="mb-1 text-pre-wrap" th:text="${commentaire.texte}">Texte du commentaire</p>

            <div th:if="${#strings.equalsIgnoreCase(commentaire.auteurEmail, emailUtilisateurConnecte)}" class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse"
                        th:data-bs-target="'#modifier-commentaire-' + ${commentaire.id}">
                    Modifier
                </button>
                <form th:action="@{/projets/{id}/commentaires/{commentaireId}/supprimer(id=${projetId},commentaireId=${commentaire.id})}"
                      method="post" class="d-inline" data-confirm="Supprimer ce commentaire ?">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                </form>
            </div>

            <div class="collapse mt-2" th:id="'modifier-commentaire-' + ${commentaire.id}">
                <form th:action="@{/projets/{id}/commentaires/{commentaireId}/modifier(id=${projetId},commentaireId=${commentaire.id})}"
                      method="post">
                    <textarea class="form-control mb-2" name="texte" rows="2" maxlength="4000" required
                              th:text="${commentaire.texte}"></textarea>
                    <button type="submit" class="btn btn-sm btn-primary">Enregistrer</button>
                </form>
            </div>
        </div>

        <form th:if="${peutCommenter}" th:action="@{/projets/{id}/commentaires(id=${projetId})}"
              th:object="${commentaireForm}" method="post" class="mt-3">
            <div class="mb-2">
                <label class="form-label" for="commentaireTexteInput">Ajouter un commentaire</label>
                <textarea class="form-control" id="commentaireTexteInput" th:field="*{texte}" rows="2" maxlength="4000"
                          th:classappend="${#fields.hasErrors('texte')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('texte')}" th:errors="*{texte}"></div>
            </div>
            <button type="submit" class="btn btn-outline-primary btn-sm">Publier</button>
        </form>
    </div>
</div>

</body>
</html>
