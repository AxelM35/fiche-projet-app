<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des roles - Voyages Scolaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container px-4" style="padding-bottom: 3rem;">

    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${messageSucces}" th:text="${messageSucces}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h1 class="h4 mb-4"><i class="bi bi-shield-lock me-2"></i>Gestion des roles</h1>

    <!-- Carte : ajouter une attribution -->
    <div class="card carte-formulaire shadow-sm">
        <div class="card-header fw-semibold"><i class="bi bi-person-plus me-2"></i>Ajouter une attribution</div>
        <div class="card-body">
            <form th:action="@{/admin/roles}" th:object="${nouvelleAttribution}" method="post" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="prenom.nom@college-sthelier.fr">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="role">Role</label>
                    <select class="form-select" id="role" th:field="*{role}"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                        <option th:each="role : ${roles}" th:value="${role}" th:switch="${role.name()}">
                            <th:block th:case="'COMPTA'">Comptabilite</th:block>
                            <th:block th:case="'VIESCO'">Vie Scolaire</th:block>
                            <th:block th:case="'DIRECTION'">Direction</th:block>
                            <th:block th:case="'ADMIN'">Admin</th:block>
                            <th:block th:case="'LECTURE_SEULE'">Lecture seule</th:block>
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Une carte par role -->
    <div class="card carte-formulaire shadow-sm" th:each="role : ${roles}">
        <div class="card-header fw-semibold" th:switch="${role.name()}">
            <i class="bi bi-people me-2"></i>
            <th:block th:case="'COMPTA'">Comptabilite</th:block>
            <th:block th:case="'VIESCO'">Vie Scolaire</th:block>
            <th:block th:case="'DIRECTION'">Direction</th:block>
            <th:block th:case="'ADMIN'">Admin</th:block>
            <th:block th:case="'LECTURE_SEULE'">Lecture seule</th:block>
        </div>
        <div class="card-body">
            <div th:if="${not #lists.isEmpty(emailsEnvParRole.get(role))}" class="mb-3">
                <div class="text-muted small mb-1">Definis via .env (redemarrage necessaire pour modifier)</div>
                <span class="badge text-bg-light border me-1 mb-1" th:each="email : ${emailsEnvParRole.get(role)}" th:text="${email}">email</span>
            </div>

            <div th:if="${#lists.isEmpty(attributionsParRole.get(role)) and #lists.isEmpty(emailsEnvParRole.get(role))}" class="text-muted small">
                Aucun utilisateur pour ce role.
            </div>

            <ul class="list-unstyled mb-0" th:unless="${#lists.isEmpty(attributionsParRole.get(role))}">
                <li th:each="attribution : ${attributionsParRole.get(role)}" class="d-flex justify-content-between align-items-center py-1">
                    <span th:text="${attribution.email}">email</span>
                    <form th:action="@{/admin/roles/{id}/supprimer(id=${attribution.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-x-lg"></i></button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
