<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Voyages Scolaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="login-page">
    <div class="card carte-formulaire shadow-sm login-card">
        <div class="card-body text-center p-4">
            <h1 class="h4 mb-1">Voyages Scolaires</h1>
            <p class="text-muted mb-4">Collège Saint-Helier</p>

            <div class="alert alert-success" role="alert" th:if="${param.deconnexion != null}">
                Vous avez été déconnecté avec succès.
            </div>
            <div class="alert alert-danger" role="alert" th:if="${param.erreur != null}">
                La connexion a échoué. Vérifiez que vous utilisez bien un compte du domaine autorisé.
            </div>

            <a class="btn btn-primary w-100" th:href="@{/oauth2/authorization/google}">
                <i class="bi bi-google me-2"></i>Se connecter avec Google
            </a>
        </div>
    </div>
</div>

</body>
</html>
