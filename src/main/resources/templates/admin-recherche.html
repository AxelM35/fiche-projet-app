<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recherche - Fiche Projet numerique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container px-4 pb-page">

    <h1 class="h4 mb-4"><i class="bi bi-search me-2"></i>Recherche admin</h1>

    <div class="card carte-formulaire shadow-sm">
        <div class="card-body">
            <form method="get" th:action="@{/admin/recherche}" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Nom du projet</label>
                    <input type="text" class="form-control" name="nom" th:value="${nom}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Organisateur</label>
                    <input type="text" class="form-control" name="organisateur" th:value="${organisateur}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Classe</label>
                    <input type="text" class="form-control" name="classe" th:value="${classe}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Statut</label>
                    <select class="form-select" name="statut">
                        <option value="" th:selected="${statut == null or statut.isEmpty()}">Tous</option>
                        <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}" th:selected="${statut == s.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Archivage</label>
                    <select class="form-select" name="archive">
                        <option value="" th:selected="${archive == null or archive.isEmpty()}">Tous</option>
                        <option value="actif" th:selected="${archive == 'actif'}">Actifs seulement</option>
                        <option value="archive" th:selected="${archive == 'archive'}">Archives seulement</option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i>Rechercher</button>
                    <a class="btn btn-outline-secondary"
                       th:href="@{/admin/recherche/export.csv(nom=${nom},organisateur=${organisateur},classe=${classe},statut=${statut},archive=${archive})}">
                        <i class="bi bi-download me-1"></i>Exporter en CSV
                    </a>
                </div>
            </form>
        </div>
    </div>

    <p class="text-muted mt-3" th:text="${#lists.size(resultats)} + ' resultat(s)'">0 resultat(s)</p>

    <div class="card carte-formulaire shadow-sm" th:unless="${#lists.isEmpty(resultats)}">
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Nom du projet</th>
                    <th>Statut</th>
                    <th>Archive</th>
                    <th>Classe(s)</th>
                    <th>Organisateur</th>
                    <th>Dates</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="projet : ${resultats}">
                    <td><a th:href="@{/projets/{id}(id=${projet.id})}" th:text="${projet.nomProjet}">Nom</a></td>
                    <td th:text="${projet.statut}">-</td>
                    <td th:text="${projet.archive} ? 'Oui' : 'Non'">-</td>
                    <td th:text="${projet.classesConcernees}">-</td>
                    <td th:text="${projet.organisateurNom}">-</td>
                    <td>
                        <span th:if="${projet.dateDepart} != null" th:text="${#temporals.format(projet.dateDepart, 'dd/MM/yyyy')}">-</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
