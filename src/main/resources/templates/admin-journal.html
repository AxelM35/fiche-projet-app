<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Journal d'audit - Fiche Projet numerique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container px-4 pb-page">

    <h1 class="h4 mb-1"><i class="bi bi-journal-text me-2"></i>Journal d'audit</h1>
    <p class="text-muted small mb-4">Les 200 evenements les plus recents (creations, validations, refus, archivages, roles...).</p>

    <p class="text-muted" th:if="${#lists.isEmpty(entrees)}">Aucun evenement enregistre.</p>

    <div class="card carte-formulaire shadow-sm" th:unless="${#lists.isEmpty(entrees)}">
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Auteur</th>
                    <th>Action</th>
                    <th>Dossier</th>
                    <th>Detail</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entree : ${entrees}">
                    <td class="text-nowrap" th:text="${#temporals.format(entree.dateEvenement, 'dd/MM/yyyy HH:mm')}">-</td>
                    <td th:text="${entree.auteurEmail}">-</td>
                    <td th:text="${entree.action}">-</td>
                    <td>
                        <a th:if="${entree.projetId} != null" th:href="@{/projets/{id}(id=${entree.projetId})}" th:text="${entree.projetNom}">-</a>
                        <span th:unless="${entree.projetId} != null" th:text="${entree.projetNom}">-</span>
                    </td>
                    <td th:text="${entree.detail}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
