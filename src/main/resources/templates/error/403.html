<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accès non autorisé - Fiche Projet numérique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="page-standalone">
    <div class="card carte-formulaire shadow-sm carte-standalone">
        <div class="card-body text-center p-4">
            <i class="bi bi-shield-lock display-4 text-danger mb-3 d-block"></i>
            <h1 class="h4 mb-2">Accès non autorisé</h1>
            <p class="text-muted mb-4">
                Vous n'avez pas les droits nécessaires pour accéder à cette page ou effectuer cette action.
                Si vous pensez qu'il s'agit d'une erreur, contactez la personne en charge de l'application
                au sein de l'établissement.
            </p>
            <a class="btn btn-primary w-100" th:href="@{/dashboard}">
                <i class="bi bi-arrow-left me-2"></i>Retour au tableau de bord
            </a>
        </div>
    </div>
</div>

</body>
</html>
