<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur technique - Fiche Projet numérique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="page-standalone">
    <div class="card carte-formulaire shadow-sm carte-standalone">
        <div class="card-body text-center p-4">
            <i class="bi bi-exclamation-octagon display-4 text-danger mb-3 d-block"></i>
            <h1 class="h4 mb-2">Une erreur est survenue</h1>
            <p class="text-muted mb-4">
                Une erreur technique inattendue s'est produite. Réessayez dans quelques instants ; si le
                problème persiste, contactez la personne en charge de l'application au sein de
                l'établissement.
            </p>
            <a class="btn btn-primary w-100" th:href="@{/dashboard}">
                <i class="bi bi-arrow-left me-2"></i>Retour au tableau de bord
            </a>

            <div th:replace="~{fragments/signalement-erreur :: signalement}"></div>
        </div>
    </div>
</div>

</body>
</html>
