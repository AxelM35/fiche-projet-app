<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dossiers bloques - Voyages Scolaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container px-4" style="padding-bottom: 3rem;">

    <h1 class="h4 mb-1"><i class="bi bi-hourglass-split me-2"></i>Dossiers en attente de validation</h1>
    <p class="text-muted small mb-4">Tries du plus ancien au plus recent, pour reperer les dossiers a relancer.</p>

    <p class="text-muted" th:if="${#lists.isEmpty(dossiersBloques)}">Aucun dossier en attente actuellement.</p>

    <div class="card carte-formulaire shadow-sm" th:unless="${#lists.isEmpty(dossiersBloques)}">
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Nom du projet</th>
                    <th>Etape en attente</th>
                    <th>En attente depuis</th>
                    <th>Organisateur</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dossier : ${dossiersBloques}">
                    <td><a th:href="@{/projets/{id}(id=${dossier.id()})}" th:text="${dossier.nomProjet()}">Nom</a></td>
                    <td th:switch="${dossier.statut().name()}">
                        <span th:case="'EN_ATTENTE_COMPTA'">Comptabilite</span>
                        <span th:case="'EN_ATTENTE_VIE_SCOLAIRE'">Vie Scolaire</span>
                        <span th:case="'EN_ATTENTE_DIRECTION'">Direction</span>
                    </td>
                    <td>
                        <span th:if="${dossier.enAttenteDepuis()} != null"
                              th:text="${#temporals.format(dossier.enAttenteDepuis(), 'dd/MM/yyyy')} + ' (' + ${dossier.joursEnAttente()} + ' j)'"
                              th:classappend="${dossier.joursEnAttente()} >= 7 ? 'text-danger fw-semibold' : ''">-</span>
                    </td>
                    <td th:text="${dossier.organisateurNom()}">-</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/projets/{id}(id=${dossier.id()})}">Voir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
