<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - Fiche Projet numerique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container px-4 pb-page">

    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${messageSucces}" th:text="${messageSucces}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert"
         th:if="${messageErreur}" th:text="${messageErreur}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h1 class="h4 mb-4"><i class="bi bi-envelope me-2"></i>Notifications email</h1>

    <div class="card carte-formulaire shadow-sm">
        <div class="card-header fw-semibold">Interrupteur</div>
        <div class="card-body">
            <p>
                Statut actuel :
                <span th:if="${notificationsActives}" class="badge bg-success">Activees</span>
                <span th:unless="${notificationsActives}" class="badge bg-secondary">Desactivees</span>
            </p>
            <p class="text-muted small">
                Reglage temporaire (non persiste) : un redemarrage de l'application reactive toujours
                les notifications par defaut.
            </p>
            <form th:if="${notificationsActives}" th:action="@{/admin/notifications/desactiver}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-bell-slash me-1"></i>Desactiver</button>
            </form>
            <form th:unless="${notificationsActives}" th:action="@{/admin/notifications/activer}" method="post" class="d-inline">
                <button type="submit" class="btn btn-primary"><i class="bi bi-bell me-1"></i>Reactiver</button>
            </form>
        </div>
    </div>

    <div class="card carte-formulaire shadow-sm">
        <div class="card-header fw-semibold">Email de test</div>
        <div class="card-body">
            <p class="text-muted small">Verifie la configuration SMTP sans attendre un vrai changement de statut.</p>
            <form th:action="@{/admin/notifications/test}" method="post" class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label class="form-label" for="destinataire">Destinataire</label>
                    <input type="email" class="form-control" id="destinataire" name="destinataire" th:value="${emailTestParDefaut}" required>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-send me-1"></i>Envoyer un test</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
