# =========================================================================
# Application - Gestion des voyages scolaires
# Toutes les valeurs sensibles sont injectees via variables d'environnement
# (voir .env.example / docker-compose.yml). Aucun secret en dur ici.
# =========================================================================

spring.application.name=voyages-scolaires
server.port=${SERVER_PORT:8080}

# --- Base de donnees PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:voyages_scolaires}
spring.datasource.username=${DB_USER:voyages_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update convient pour ce livrable ; en production reelle, preferer
# un outil de migration versionne (Flyway/Liquibase) plutot que l'auto-DDL Hibernate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Authentification Google OAuth2 ---
# Client ID / Secret a creer dans Google Cloud Console (ecran de consentement
# restreint au domaine de l'etablissement), puis a fournir via variables d'env.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# --- Domaine autorise a se connecter ---
voyages.security.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:college-sthelier.fr}

# --- Attribution des roles RBAC (listes d'emails, separees par des virgules) ---
# ROLE_PROF est attribue par defaut a tout utilisateur du domaine autorise.
voyages.roles.admin=${ROLES_ADMIN:amorvan@college-sthelier.fr}
voyages.roles.compta=${ROLES_COMPTA:compta@college-sthelier.fr}
voyages.roles.viesco=${ROLES_VIESCO:viesco@college-sthelier.fr}
voyages.roles.direction=${ROLES_DIRECTION:direction@college-sthelier.fr}

# --- Envoi d'emails (notifications de workflow) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
voyages.notifications.email-expediteur=${MAIL_FROM:noreply@college-sthelier.fr}
voyages.notifications.url-application=${APP_BASE_URL:http://localhost:8080}

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# --- Logs ---
logging.level.fr.collegesthelier.voyages=${LOG_LEVEL:INFO}
