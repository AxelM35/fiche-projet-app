# =========================================================================
# Fiche Projet numérique - Gestion et validation des projets de voyages
# scolaires d'un établissement du second degré.
# Toutes les valeurs sensibles sont injectées via variables d'environnement
# (voir .env.example / docker-compose.yml). Aucun secret en dur ici.
# =========================================================================

spring.application.name=fiche-projet
server.port=${SERVER_PORT:8080}

# --- Base de données PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiche_projet}
spring.datasource.username=${DB_USER:fiche_projet_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma est géré par les migrations Flyway (src/main/resources/db/migration).
# validate vérifie au démarrage que les entités JPA correspondent au schéma
# réellement en base, sans jamais le modifier lui-même.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Authentification Google OAuth2 ---
# Client ID / Secret à créer dans Google Cloud Console (écran de consentement
# restreint au domaine de l'établissement), puis à fournir via variables d'env.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# --- Identité de l'établissement qui déploie l'application ---
# Affiché dans la barre de navigation, sur la page de connexion et dans les
# emails. Vide par défaut : la mention est simplement masquée.
ficheprojet.etablissement.nom=${ETABLISSEMENT_NOM:}

# --- Domaine autorisé à se connecter ---
ficheprojet.security.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:}

# --- Attribution des rôles RBAC (listes d'emails, séparées par des virgules) ---
# ROLE_PROF est attribué par défaut à tout utilisateur du domaine autorisé.
# Vides par défaut : chaque établissement renseigne ses propres adresses
# dans .env (voir .env.example).
ficheprojet.roles.admin=${ROLES_ADMIN:}
ficheprojet.roles.compta=${ROLES_COMPTA:}
ficheprojet.roles.viesco=${ROLES_VIESCO:}
ficheprojet.roles.direction=${ROLES_DIRECTION:}
# Observateurs en lecture seule (ex. secrétariat) : consultent tout, ne
# peuvent rien créer ni valider. Reçoivent ROLE_LECTURE_SEULE à la place de
# ROLE_PROF (jamais les deux). Vide par défaut : aucun impact tant que la
# variable n'est pas renseignée.
ficheprojet.roles.lecture-seule=${ROLES_LECTURE_SEULE:}

# --- Envoi d'emails (notifications de workflow) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
ficheprojet.notifications.email-expediteur=${MAIL_FROM:}
ficheprojet.notifications.url-application=${APP_BASE_URL:http://localhost:8080}

# --- Relances automatiques sur dossiers bloqués (RelanceService, tâche
# quotidienne à 8h) : première relance au rôle valideur en attente après
# seuil-jours de blocage sur une étape, puis répétée tous les periode-jours
# tant que le dossier reste bloqué. Désactivées en même temps que le reste
# des notifications via l'interrupteur admin (/admin/notifications).
ficheprojet.relances.seuil-jours=${RELANCES_SEUIL_JOURS:7}
ficheprojet.relances.periode-jours=${RELANCES_PERIODE_JOURS:7}

# --- Google Drive (création automatique du dossier de pièces jointes) ---
# Désactivé par défaut : GoogleDriveService reste alors un no-op silencieux,
# le lien Drive se saisit à la main (voir docs/CAHIER_DES_CHARGES.md).
ficheprojet.drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
ficheprojet.drive.shared-drive-id=${GOOGLE_DRIVE_SHARED_DRIVE_ID:}
ficheprojet.drive.credentials-json-base64=${GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64:}

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# --- Endpoint de santé (monitoring du conteneur) ---
# Seul /actuator/health est exposé (jamais les autres endpoints Actuator :
# env, beans, etc. exposeraient trop d'informations). show-details=never
# (défaut Spring Boot, explicite ici) : l'endpoint est public (voir
# SecurityConfig), il ne doit donc renvoyer qu'un statut global (UP/DOWN),
# jamais le détail des composants vérifiés (base, disque...) à un appelant
# anonyme. L'indicateur mail est désactivé : un incident SMTP ne doit pas
# faire passer tout le conteneur pour en panne.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# --- Logs ---
logging.level.fr.ficheprojet=${LOG_LEVEL:INFO}
