# =========================================================================
# Application - Gestion des voyages scolaires
# Toutes les valeurs sensibles sont injectees via variables d'environnement
# (voir .env.example / docker-compose.yml). Aucun secret en dur ici.
# =========================================================================

spring.application.name=voyages-scolaires
server.port=${SERVER_PORT:8080}

# --- Base de donnees PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:voyages_scolaires}
spring.datasource.username=${DB_USER:voyages_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est gere par les migrations Flyway (src/main/resources/db/migration).
# validate verifie au demarrage que les entites JPA correspondent au schema
# reellement en base, sans jamais le modifier lui-meme.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Authentification Google OAuth2 ---
# Client ID / Secret a creer dans Google Cloud Console (ecran de consentement
# restreint au domaine de l'etablissement), puis a fournir via variables d'env.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# --- Domaine autorise a se connecter ---
voyages.security.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:college-sthelier.fr}

# --- Attribution des roles RBAC (listes d'emails, separees par des virgules) ---
# ROLE_PROF est attribue par defaut a tout utilisateur du domaine autorise.
voyages.roles.admin=${ROLES_ADMIN:amorvan@college-sthelier.fr}
voyages.roles.compta=${ROLES_COMPTA:compta@college-sthelier.fr}
voyages.roles.viesco=${ROLES_VIESCO:viesco@college-sthelier.fr}
voyages.roles.direction=${ROLES_DIRECTION:direction@college-sthelier.fr}
# Observateurs en lecture seule (ex. secretariat) : consultent tout, ne
# peuvent rien creer ni valider. Recoivent ROLE_LECTURE_SEULE a la place de
# ROLE_PROF (jamais les deux). Vide par defaut : aucun impact tant que la
# variable n'est pas renseignee.
voyages.roles.lecture-seule=${ROLES_LECTURE_SEULE:}

# --- Envoi d'emails (notifications de workflow) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
voyages.notifications.email-expediteur=${MAIL_FROM:noreply@college-sthelier.fr}
voyages.notifications.url-application=${APP_BASE_URL:http://localhost:8080}

# --- Relances automatiques sur dossiers bloques (RelanceService, tache
# quotidienne a 8h) : premiere relance au role valideur en attente apres
# seuil-jours de blocage sur une etape, puis repetee tous les periode-jours
# tant que le dossier reste bloque. Desactivees en meme temps que le reste
# des notifications via l'interrupteur admin (/admin/notifications).
voyages.relances.seuil-jours=${RELANCES_SEUIL_JOURS:7}
voyages.relances.periode-jours=${RELANCES_PERIODE_JOURS:7}

# --- Google Drive (creation automatique du dossier de pieces jointes) ---
# Desactive par defaut : GoogleDriveService reste alors un no-op silencieux,
# le lien Drive se saisit a la main (voir docs/CAHIER_DES_CHARGES.md).
voyages.drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
voyages.drive.shared-drive-id=${GOOGLE_DRIVE_SHARED_DRIVE_ID:}
voyages.drive.credentials-json-base64=${GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64:}

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# --- Endpoint de sante (monitoring du conteneur) ---
# Seul /actuator/health est expose (jamais les autres endpoints Actuator :
# env, beans, etc. exposeraient trop d'informations). show-details=never
# (defaut Spring Boot, explicite ici) : l'endpoint est public (voir
# SecurityConfig), il ne doit donc renvoyer qu'un statut global (UP/DOWN),
# jamais le detail des composants verifies (base, disque...) a un appelant
# anonyme. L'indicateur mail est desactive : un incident SMTP ne doit pas
# faire passer tout le conteneur pour en panne.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# --- Logs ---
logging.level.fr.collegesthelier.voyages=${LOG_LEVEL:INFO}
