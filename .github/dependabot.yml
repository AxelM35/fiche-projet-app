version: 2
updates:
  # Dependances Maven (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Images de base du Dockerfile (eclipse-temurin)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions utilisees dans les workflows CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
