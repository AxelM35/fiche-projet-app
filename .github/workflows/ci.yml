name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 = version cible declaree dans le pom (java.version), plancher
        # supporte. 25 = version utilisee par les images du Dockerfile, donc
        # celle qui compile et execute reellement l'application en production.
        # Les deux sont testees pour ne jamais livrer sur un JDK non couvert.
        java: ['17', '25']
    name: Tests (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Tests
        run: ./mvnw --batch-mode test
